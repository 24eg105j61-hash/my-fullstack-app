services:
  # Backend Express REST API Web Service on Render
  - type: web
    name: student-planner-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: student-planner-db
          property: connectionString
      - key: CLIENT_URL
        value: "*"

databases:
  # Managed PostgreSQL Database on Render
  - name: student-planner-db
    databaseName: student_planner
    user: student_admin
    plan: free
    region: oregon
    postgresMajorVersion: "16"
